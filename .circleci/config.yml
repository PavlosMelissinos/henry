version: 2.1

jobs:
  unit_testing:
    docker:
      - image: cimg/clojure:1.12.0-openjdk-21.0
    steps:
      - checkout
      - add_ssh_keys

      # Download and cache dependencies
      - restore_cache:
          keys:
            - deps-cache-{{ checksum "deps.edn" }}
      - run: clojure -A:test
      - save_cache:
          key: deps-cache-{{ checksum "deps.edn" }}
          paths:
            - ~/.m2
      - store_test_results:
          path: test-results

workflows:
  version: 2
  feature_branches:
    jobs:
      - unit_testing:
          filters:
            branches:
              ignore:
                - master

  master:
    jobs:
      - unit_testing:
          filters:
            branches:
              only:
                - master
